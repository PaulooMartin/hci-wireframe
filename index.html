<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>Dashboard · Payroll</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar"></header>
  <div class="layout">
    <nav class="sidebar">
      <a class="nav-link active" href="index.html" data-nav="dashboard">Dashboard</a>
      <a class="nav-link" href="attendance.html" data-nav="attendance">Attendance Record</a>
      <a class="nav-link" href="payslips.html" data-nav="payslips">Payslips</a>
      <a class="nav-link" href="payroll-reports.html" data-nav="payroll-reports">Payroll Reports</a>
    </nav>
    <main class="content">
      <h1>Employee Payroll Overview</h1>
      <div class="toolbar">
        <div class="dropdown" id="period-dropdown"></div>
        <div class="search" id="search">
          <label for="search-input">Search:</label>
          <input id="search-input" type="text" placeholder="example: Employee name or number..." autocomplete="off" spellcheck="false">
          <ul class="menu" hidden></ul>
        </div>
      </div>
      <section class="card">
        <h2>Attendance Records</h2>
        <p class="stats">
          <a href="attendance.html" data-stat="overtime">Overtime Hours: N/A</a>
          <a href="attendance.html" data-stat="leaves">Approved Leaves: N/A</a>
          <a href="attendance.html" data-stat="absences">Absences: N/A</a>
        </p>
        <a class="card-link" href="attendance.html">View record →</a>
      </section>
      <section class="card">
        <h2>Payslips</h2>
        <p class="stats">
          <a href="payslips.html" data-stat="payslip">N/A</a>
        </p>
        <a class="card-link" href="payslips.html">View records →</a>
      </section>
      <section class="card">
        <h2>Payroll Reports</h2>
        <p class="stats">
          <a href="payroll-reports.html" data-stat="reports">N/A</a>
        </p>
        <a class="card-link" href="payroll-reports.html">View reports →</a>
      </section>
    </main>
  </div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
